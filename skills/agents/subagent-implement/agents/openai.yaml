interface:
  display_name: "Subagent Implement"
  short_description: "Dispatch a grill-to-tickets ticket set to native harness subagents, verify each, integrate one commit per ticket, stop before review"
  default_prompt: "Use $subagent-implement to plan this ticket directory into dependency order, dispatch one native subagent per ticket to build it test-first in an isolated worktree, verify each with a fresh subagent, integrate one commit per ticket, and stop before review: [dir|slug]."
policy:
  allow_implicit_invocation: false
